    <style>
        /* ==========================================================================
           1. CSS RESET & GLOBAL VARIABLES
           ========================================================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 40%, #e0e7ff 100%);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #38bdf8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.82);
            --card-border: rgba(255, 255, 255, 0.9);
            --shadow-soft: 0 15px 35px -5px rgba(14, 165, 233, 0.12), 0 8px 20px -6px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 20px 40px -5px rgba(14, 165, 233, 0.25), 0 12px 25px -6px rgba(0, 0, 0, 0.08);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-dark);
            padding: 40px 20px 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient floating background elements */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 18s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: #bae6fd;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #c7d2fe;
            bottom: -150px;
            right: -100px;
            animation-delay: -7s;
        }
